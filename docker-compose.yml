# ── Docker Compose — MOJ Case Tracking System ─────────────────
# For production: set JWT_SECRET and other env vars via .env file
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f        # Follow logs

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - JWT_EXPIRES_IN=8h
      - CORS_ORIGIN=http://localhost:80,https://yourdomain.com
      - DB_PATH=/app/data/magistrate.db
      - RATE_LIMIT_WINDOW_MIN=15
      - RATE_LIMIT_MAX_REQUESTS=10
    volumes:
      - moj_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  moj_data:
